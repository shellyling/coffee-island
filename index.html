<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; font-family: system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>咖啡地圖島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="咖啡的世界：手沖、咖啡豆、風味、拉花、咖啡廳、咖啡師、產區、器材、烘焙，九座島一次逛完。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-screen 3D sea of hexagon islands; floating title top-left, tool buttons top-right,
   island card slides in from the right on desktop and up from the bottom on phones. */
:root {
  --milk: #E8D8C3;      /* 奶茶 background / sky */
  --sea: #D6BFA0;       /* deeper milk-tea sea */
  --foam: #FBF6EE;      /* card surface */
  --brew: #3F2B20;      /* text, like dark roast */
  --brew-soft: #7A5E4C; /* secondary text */
  --tea: #A8724A;       /* accent, caramel */
  --line: rgba(63, 43, 32, .14);
  --shadow: 0 18px 40px -18px rgba(63, 43, 32, .45);
  --f-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --milk: #1F1813; --sea: #2B2119; --foam: #2E241C; --brew: #F2E6D7; --brew-soft: #C3AD97;
    --tea: #D8A576; --line: rgba(242, 230, 215, .14); --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --milk: #1F1813; --sea: #2B2119; --foam: #2E241C; --brew: #F2E6D7; --brew-soft: #C3AD97;
  --tea: #D8A576; --line: rgba(242, 230, 215, .14); --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--milk); color: var(--brew);
  font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

/* Header */
.brand {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(14px, env(safe-area-inset-left, 0px));
  pointer-events: none; max-width: min(360px, calc(100% - 96px));
  background: color-mix(in srgb, var(--foam) 82%, transparent);
  border: 1px solid var(--line); border-radius: 18px; padding: 10px 16px 12px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.brand h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(24px, 4vw, 34px); line-height: 1.1; letter-spacing: .02em; text-wrap: balance;
}
.brand p { margin: 2px 0 0; color: var(--brew-soft); font-size: 14px; }
.brand .count { font-family: var(--f-data); font-size: 11px; letter-spacing: .08em; color: var(--tea); }

.tools {
  position: fixed; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: max(14px, env(safe-area-inset-right, 0px));
  max-width: 50%;
}
.tool {
  font: 500 14px/1 var(--f-body); color: var(--brew);
  background: var(--foam); border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 14px; cursor: pointer; box-shadow: var(--shadow);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.tool .ic { font-size: 15px; line-height: 1; width: 1em; text-align: center; }
.tool:hover { border-color: var(--tea); }
.tool[aria-pressed="true"] { background: var(--brew); color: var(--foam); border-color: var(--brew); }
.tool:focus-visible, .label:focus-visible, .nav button:focus-visible, .close:focus-visible,
.list-item:focus-visible, .rel:focus-visible, .timer button:focus-visible, .timer input:focus-visible, .timer select:focus-visible {
  outline: 2px solid var(--tea); outline-offset: 2px;
}
@media (max-width: 560px) {
  .tools { flex-direction: column; align-items: flex-end; }
  .tool { padding: 11px; }
  .tool .t { display: none; }
}

/* Floating island name tags */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.label {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  font: 400 15px/1 var(--f-display); color: var(--brew); white-space: nowrap;
  background: var(--foam); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 12px 7px 9px; display: flex; align-items: center; gap: 7px;
  box-shadow: 0 6px 16px -8px rgba(63,43,32,.5);
  transition: background .2s, color .2s, opacity .3s;
  will-change: transform;
}
.label i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.label:hover, .label.active { background: var(--brew); color: var(--foam); }
.label.linked { box-shadow: 0 0 0 2px var(--tea), 0 6px 16px -8px rgba(63,43,32,.5); }
.label.home { font-size: 13px; }
.label.hidden { opacity: 0; pointer-events: none; }
@media (max-width: 560px) { .label { font-size: 13px; padding: 6px 10px 6px 8px; } }

.hint {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: var(--foam); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 16px; font-size: 13px; color: var(--brew-soft); white-space: nowrap; box-shadow: var(--shadow);
  transition: opacity .3s;
}
.hint.gone { opacity: 0; pointer-events: none; }
.clock {
  position: fixed; z-index: 4; left: max(14px, env(safe-area-inset-left, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  font-family: var(--f-data); font-size: 12px; color: var(--brew-soft);
  background: var(--foam); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  font-variant-numeric: tabular-nums;
}
@media (max-width: 760px) { .clock { display: none; } }

/* Panel: island card + list share one container */
.panel {
  position: fixed; z-index: 6; background: var(--foam); color: var(--brew);
  box-shadow: var(--shadow); border: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
@media (min-width: 761px) {
  .panel {
    top: calc(env(safe-area-inset-top, 0px) + 76px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    right: max(18px, env(safe-area-inset-right, 0px));
    width: 400px; border-radius: 22px;
  }
  .panel.closed { transform: translateX(calc(100% + 40px)); opacity: 0; pointer-events: none; }
}
@media (max-width: 760px) {
  .panel {
    left: 0; right: 0; bottom: 0; max-height: 60%;
    border-radius: 22px 22px 0 0; border-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel.closed { transform: translateY(105%); opacity: 0; pointer-events: none; }
}
.panel-head {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 18px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
}
.panel-head .titles { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--f-data); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--tea); }
.panel h2 { margin: 2px 0 0; font: 400 28px/1.2 var(--f-display); text-wrap: balance; }
.panel .lead { margin: 6px 0 0; color: var(--brew-soft); font-size: 14px; }
.close {
  flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: transparent; color: var(--brew); font-size: 18px; cursor: pointer; line-height: 1;
}
.close:hover { background: var(--milk); }
.panel-body {
  overflow-y: auto; overscroll-behavior: contain; min-height: 0;
  padding: 16px max(20px, env(safe-area-inset-right, 0px)) 18px max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.section-title { margin: 0 0 6px; font: 400 17px/1.3 var(--f-display); display: flex; align-items: center; gap: 8px; }
.section-title small { font-family: var(--f-data); font-size: 11px; color: var(--tea); letter-spacing: .08em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--f-data); font-size: 12px; padding: 5px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--c) 28%, var(--foam)); color: var(--brew);
  font-variant-numeric: tabular-nums;
}
.points { list-style: none; margin: 0; padding: 0; display: grid; }
.points li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
.points li:first-child { border-top: 0; padding-top: 2px; }
.points li::before { content: ""; width: 10px; height: 13px; margin-top: 6px; border-radius: 50%; background: var(--c); transform: rotate(-20deg); box-shadow: inset 2px 0 0 rgba(0,0,0,.18); }
.points b { display: block; font-weight: 700; font-size: 15px; }
.points span { color: var(--brew-soft); font-size: 14px; }

.rels { display: grid; gap: 8px; }
.rel {
  text-align: left; font: inherit; color: var(--brew); cursor: pointer;
  background: color-mix(in srgb, var(--milk) 45%, var(--foam)); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center;
}
.rel:hover { border-color: var(--tea); }
.rel .hex { grid-row: span 2; width: 18px; height: 20px; background: var(--c); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.rel b { font: 400 15px/1.3 var(--f-display); }
.rel b::after { content: " →"; color: var(--tea); }
.rel span { color: var(--brew-soft); font-size: 13px; line-height: 1.5; }

/* Brew timer */
.timer { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: color-mix(in srgb, var(--c) 12%, var(--foam)); display: grid; gap: 12px; }
.timer .inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.timer label { display: grid; gap: 4px; font-size: 12px; color: var(--brew-soft); }
.timer input, .timer select {
  font: 500 16px/1 var(--f-data); color: var(--brew); background: var(--foam);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 92px;
  font-variant-numeric: tabular-nums;
}
.timer .water { font-family: var(--f-data); font-size: 13px; color: var(--brew); padding-bottom: 9px; }
.timer .water b { font-size: 18px; }
.timer .readout { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.timer .time { font: 500 40px/1 var(--f-data); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.timer .now { text-align: right; min-width: 0; }
.timer .now b { display: block; font: 400 18px/1.3 var(--f-display); }
.timer .now span { font-family: var(--f-data); font-size: 13px; color: var(--tea); font-variant-numeric: tabular-nums; }
.timer .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.timer .bar i { display: block; height: 100%; width: 0; background: var(--tea); border-radius: inherit; }
.timer ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; }
.timer ol li { display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; padding: 4px 8px; border-radius: 8px; color: var(--brew-soft); font-variant-numeric: tabular-nums; }
.timer ol li .m { font-family: var(--f-data); }
.timer ol li.on { background: var(--brew); color: var(--foam); }
.timer ol li.done { text-decoration: line-through; opacity: .6; }
.timer .btns { display: flex; gap: 8px; }
.timer .btns button {
  flex: 1; font: 500 15px/1 var(--f-body); border-radius: 12px; padding: 12px; cursor: pointer;
  border: 1px solid var(--brew); background: var(--brew); color: var(--foam);
}
.timer .btns button.ghost { background: transparent; color: var(--brew); border-color: var(--line); }

.nav { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.nav button {
  flex: 1; min-width: 0; font: 500 14px/1.2 var(--f-body); color: var(--brew); background: transparent;
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; cursor: pointer;
}
.nav button:hover { border-color: var(--tea); }

.list-item {
  width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center;
  background: transparent; border: 0; border-top: 1px solid var(--line); padding: 12px 4px; cursor: pointer; color: var(--brew);
  font: inherit;
}
.list-item:first-child { border-top: 0; }
.list-item:hover { background: color-mix(in srgb, var(--milk) 60%, transparent); border-radius: 12px; }
.list-item .hex { width: 30px; height: 34px; background: var(--c); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.list-item b { font: 400 18px/1.2 var(--f-display); display: block; }
.list-item small { color: var(--brew-soft); font-size: 13px; }
.list-item em { font-style: normal; font-family: var(--f-data); font-size: 12px; color: var(--tea); }
.list-group { display: grid; }

.loading {
  position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--milk);
  font-family: var(--f-display); font-size: 18px; color: var(--brew-soft); transition: opacity .5s;
}
.loading.done { opacity: 0; pointer-events: none; }
.fallback { max-width: 34em; padding: 0 20px; text-align: center; font-family: var(--f-body); font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  .panel, .label, .hint { transition: none; }
}
</style>
<meta property="og:title" content="咖啡地圖島">

<body>
<div id="stage" aria-hidden="true"></div>
<div id="labels"></div>

<header class="brand">
  <h1 id="siteTitle">咖啡地圖島</h1>
  <p id="siteSub">咖啡的世界</p>
  <div class="count" id="siteCount">9 ISLANDS</div>
</header>

<nav class="tools" aria-label="地圖工具">
  <button class="tool" id="btnHome" type="button" title="回到全景"><span class="ic">⌂</span><span class="t">全景</span></button>
  <button class="tool" id="btnList" type="button" aria-pressed="false" title="島嶼清單"><span class="ic">☰</span><span class="t">清單</span></button>
  <button class="tool" id="btnLinks" type="button" aria-pressed="false" title="顯示島嶼之間的關聯"><span class="ic">⟡</span><span class="t">關聯</span></button>
  <button class="tool" id="btnTime" type="button" title="切換白天、黃昏、夜晚"><span class="ic" id="timeIc">☀</span><span class="t" id="timeTx">自動</span></button>
</nav>

<div class="hint" id="hint">點一座島開始探索 · 拖曳可旋轉</div>
<div class="clock" id="clock"></div>

<aside class="panel closed" id="panel" aria-live="polite" aria-label="島嶼介紹"></aside>

<div class="loading" id="loading">正在沖煮島嶼…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
/* =====================================================================
   內容資料：日後只要改這裡
   at：島的位置。[0]～[5] 是第一圈（繞中央島），[0,1] 代表在 0 號和 1 號中間的外圈
   ===================================================================== */
const SITE = { title: '咖啡地圖島', subtitle: '咖啡的世界' };

const ISLANDS = [
  {
    id: 'pour-over', name: '手沖島', color: '#C99A6E', landmark: 'pourover', at: [0], tool: 'brew-timer',
    lead: '一壺熱水，沖出一杯屬於你的咖啡',
    chips: ['粉水比 1:15', '15g 粉 · 225g 水', '水溫 90–96°C', '約 2:30–3:00'],
    points: [
      ['準備器材', '濾杯、濾紙、細口手沖壺、電子秤、計時器，加上新鮮研磨的咖啡豆。'],
      ['研磨粗細', '中細研磨，大約像細砂糖。太細容易苦澀，太粗喝起來偏水。'],
      ['悶蒸 30 秒', '先倒入約粉量 2 倍的熱水，讓咖啡粉膨脹排氣，萃取會更均勻。'],
      ['分段注水', '從中心往外繞圈，分 2～3 次把水加到目標重量，水流保持穩定。'],
      ['調整口味', '太酸就磨細一點或延長時間；太苦就磨粗一點或降低水溫。']
    ]
  },
  {
    id: 'beans', name: '咖啡豆島', color: '#8A5A3A', landmark: 'beans', at: [1],
    lead: '同一顆咖啡果實，不同的處理，不同的味道',
    chips: ['採收 → 處理 → 乾燥', '生豆含水率約 10–12%'],
    points: [
      ['水洗處理', '去除果皮果肉後發酵、清洗再乾燥。風味乾淨明亮，酸質清楚。'],
      ['日曬處理', '整顆咖啡果實直接曝曬乾燥。果香濃郁、甜感高，常帶莓果或酒香。'],
      ['蜜處理', '去果皮但保留部分果膠再乾燥，依保留多寡分黃蜜、紅蜜、黑蜜，風味介於水洗與日曬之間。'],
      ['厭氧發酵', '在密封、缺氧的環境中發酵，帶來強烈而獨特的風味，近年精品咖啡很常見。'],
      ['濕剝處理', '印尼常見的作法，豆子還濕時就脫殼，風味厚實，帶草本與土壤感。']
    ]
  },
  {
    id: 'flavor', name: '咖啡風味島', color: '#D9876A', landmark: 'flavor', at: [2],
    lead: '學會用舌頭讀一杯咖啡',
    chips: ['酸 · 甜 · 醇厚 · 餘韻', 'SCA 風味輪'],
    points: [
      ['酸質', '好的酸像水果，明亮清爽；淺焙豆通常酸質較明顯。'],
      ['甜感', '像焦糖、蜂蜜或熟水果的甜，是一杯好咖啡的骨架。'],
      ['醇厚度', '咖啡在口中的重量與質地，從像茶一樣輕盈，到像牛奶一樣厚實。'],
      ['餘韻', '喝下去之後留在口中的味道，越長、越乾淨越好。'],
      ['烘焙度與風味', '淺焙偏花香、柑橘、莓果；中焙偏焦糖、堅果；深焙偏可可、煙燻。']
    ]
  },
  {
    id: 'latte-art', name: '拉花島', color: '#EADCC6', landmark: 'latte', at: [3],
    lead: '在牛奶與濃縮咖啡之間畫畫',
    chips: ['奶溫 55–65°C', '綿密奶泡', '愛心 → 鬱金香 → 葉子 → 天鵝'],
    points: [
      ['打奶泡', '蒸汽管先貼近表面打入空氣，再深入讓牛奶旋轉，打出細緻光滑的奶泡。'],
      ['融合', '杯子傾斜，從較高處細細倒入，讓牛奶沉到濃縮咖啡底下融合。'],

function brewPlan(dose, ratio) {
  const water = Math.round(dose * ratio);
  return {
    water,
    stages: [
      { t0: 0,   t1: 30,  name: '悶蒸',       target: Math.round(dose * 2) },
      { t0: 30,  t1: 70,  name: '第一段注水', target: Math.round(water * 0.6) },
      { t0: 70,  t1: 110, name: '第二段注水', target: water },
      { t0: 110, t1: 165, name: '等待滴完',   target: water }
    ],
    total: 165
  };
}
function brewStageAt(plan, sec) {
  const i = plan.stages.findIndex(s => sec >= s.t0 && sec < s.t1);
  return i === -1 ? (sec >= plan.total ? plan.stages.length : 0) : i;   // length = 完成
}
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

const brew = { dose: 15, ratio: 15, running: false, startedAt: 0, elapsed: 0, lastStage: -1, audio: null };
function brewElapsed() { return brew.running ? brew.elapsed + (performance.now() - brew.startedAt) / 1000 : brew.elapsed; }
function beep(high) {
  try {
    const ac = brew.audio; if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = high ? 880 : 660; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(.2, ac.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .35); o.start(); o.stop(ac.currentTime + .4);
  } catch (e) {}
}

function bindTimer() {
  const dose = $('#brewDose'), ratio = $('#brewRatio');
  if (!dose) return;
  const upd = () => {
    const v = parseFloat(dose.value); if (v > 0 && v <= 100) brew.dose = v;
    brew.ratio = parseInt(ratio.value, 10); brew.lastStage = -1; updateTimer(true);
  };
  dose.addEventListener('input', upd); ratio.addEventListener('change', upd);
  $('#brewGo').addEventListener('click', () => {
    if (!brew.audio) { try { brew.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (brew.running) { brew.elapsed = brewElapsed(); brew.running = false; }
    else {
      if (brew.elapsed >= brewPlan(brew.dose, brew.ratio).total) brew.elapsed = 0;
      brew.startedAt = performance.now(); brew.running = true;
    }
    updateTimer(true);
  });
  $('#brewReset').addEventListener('click', () => { brew.running = false; brew.elapsed = 0; brew.lastStage = -1; updateTimer(true); });
  updateTimer(true);
}
function updateTimer(force) {
  const el = $('#brewTime'); if (!el) return;
  const plan = brewPlan(brew.dose, brew.ratio);
  let sec = brewElapsed();
  if (sec >= plan.total && brew.running) { brew.elapsed = plan.total; brew.running = false; sec = plan.total; beep(true); setTimeout(() => beep(true), 220); }
  const si = brewStageAt(plan, sec);
  if (brew.running && si !== brew.lastStage && brew.lastStage !== -1) beep(false);
  if (brew.running || force) brew.lastStage = si;
  el.textContent = mmss(sec);
  $('#brewWater').textContent = plan.water;
  $('#brewBar').style.width = Math.min(100, sec / plan.total * 100) + '%';
  $('#brewGo').textContent = brew.running ? '暫停' : (sec > 0 && sec < plan.total ? '繼續' : (sec >= plan.total ? '再沖一杯' : '開始'));
  const now = $('#brewNow'), tgt = $('#brewTarget');
  if (si >= plan.stages.length) { now.textContent = '完成，享用吧！'; tgt.textContent = `共 ${plan.water} g 水`; }
  else if (sec === 0 && !brew.running) { now.textContent = '準備開始'; tgt.textContent = `先倒 ${plan.stages[0].target} g 水悶蒸`; }
  else {
    const s = plan.stages[si];
    now.textContent = s.name;
    tgt.textContent = si === 3 ? `剩 ${Math.ceil(s.t1 - sec)} 秒` : `注水到 ${s.target} g · 剩 ${Math.ceil(s.t1 - sec)} 秒`;
  }
  if (force || brew.running) {
    $('#brewSteps').innerHTML = plan.stages.map((s, i) =>
      `<li class="${i === si && sec > 0 ? 'on' : (i < si ? 'done' : '')}"><span class="m">${mmss(s.t0)}</span><span>${s.name}</span><span class="m">${i === 3 ? '—' : s.target + ' g'}</span></li>`).join('');
  }
}

/* Merge every static mesh under `root` into one mesh per material: far fewer draw calls */
function bake(root) {
  if (!MERGE) return;
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets = new Map(), gone = [], tmp = new THREE.Matrix4();
  (function walk(o) {
    for (const c of o.children) {
      if (c.userData.dynamic) continue;
      if (c.isMesh) {
        let g = c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone();
        g.applyMatrix4(tmp.multiplyMatrices(inv, c.matrixWorld));
        Object.keys(g.attributes).forEach(k => { if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k); });
        if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
        g.clearGroups();
        const key = c.material.uuid;
        if (!buckets.has(key)) buckets.set(key, { m: c.material, gs: [] });
        buckets.get(key).gs.push(g); gone.push(c);
      }
      walk(c);
    }
  })(root);
  gone.forEach(c => { c.parent.remove(c); c.geometry.dispose(); });
  buckets.forEach(({ m, gs }) => {
    const geo = THREE.BufferGeometryUtils.mergeBufferGeometries(gs, false);
    gs.forEach(g => g.dispose());
    if (!geo) return;
    const o = new THREE.Mesh(geo, m); o.castShadow = !m.transparent; o.receiveShadow = true; root.add(o);
  });
}

  const leaves = [C.leaf, C.leaf2, C.leaf3];

}

  if (o.balloon) {

    handR.add(mesh(new THREE.ConeGeometry(.014, .02, 6), mat(o.balloon), .12, .49, 0));
  }

  torso.add(cyl(.026, .03, .05, 8, skinM, 0, .225, 0));
  if (o.scarf) { const sc = mesh(new THREE.TorusGeometry(.045, .02, 6, 16), mat(o.scarf), 0, .23, 0); sc.rotation.x = Math.PI / 2; torso.add(sc); torso.add(box(.035, .1, .015, mat(o.scarf), .03, .17, .07)); }
  const head = new THREE.Group(); head.position.y = .335; torso.add(head);
  if (human) humanFace(head, o, skinM); else animalFace(head, o, skinM, lightM);
  if (o.headband) { const hb = mesh(new THREE.TorusGeometry(.101, .012, 6, 24), mat(o.headband), 0, .045, 0); hb.rotation.x = Math.PI / 2 - .15; head.add(hb); }
  if (o.hat) {

  if (o.helmet) {
    const hm = mat(o.helmet, { roughness: .35 });

    head.add(box(.014, .07, .2, mat('#C46A4F'), 0, .1, -.02));
  }
  let tail = null;
  if (!human) { tail = tailFor(o, skinM, lightM); tail.position.set(0, .21, o.bottom === 'skirt' ? -.11 : -.065 * W); g.add(tail); }

  g.userData.limbs = { legL: legs[0], legR: legs[1], armL: arms[0].A, armR: arms[1].A, tail };
  if (o.animate) {
    legs.forEach(dyn); arms.forEach(a => dyn(a.A)); if (tail) dyn(tail);
    bake(g); legs.forEach(bake); arms.forEach(a => bake(a.A)); if (tail) bake(tail);
  }
  return g;
}

/* ---------- island decoration: trees, flowers, rocks, stepping-stone path ---------- */
function decorate(group, data) {
  const r = rng(data.id), d = new THREE.Group();
  // corner spots (hex vertices) — outside the walking path
  const kinds = ['round', 'pine', 'round', 'garden', 'rocks', 'bench'];
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3, cx = Math.cos(a) * 1.74, cz = Math.sin(a) * 1.74;
    const kind = kinds[Math.floor(r() * kinds.length)];
    if (kind === 'round') d.add(roundTree(cx * 1.02, cz * 1.02, .6 + r() * .08, r, true));
    if (kind === 'pine') d.add(pine(cx * 1.02, cz * 1.02, .6 + r() * .08));
    if (kind === 'garden') {
      const cols = ['#F3E7F0', '#E8A3C2', C.lemon, '#C46A4F', '#FFFFFF'];
      for (let i = 0; i < 6; i++) d.add(flower(cx + (r() - .5) * .3, cz + (r() - .5) * .3, cols[Math.floor(r() * cols.length)]));
      d.add(sph(.12, mat(C.leafDark), cx, .08, cz, 7, 6));
    }
    if (kind === 'rocks') { d.add(rock(cx, .06, cz, .13, r)); d.add(rock(cx + .14, .04, cz + .08, .08, r)); d.add(flower(cx - .1, cz + .1, '#FFFFFF')); }
    if (kind === 'bench') { d.add(bench(cx * .96, cz * .96, -a + Math.PI / 2)); d.add(lamp(cx + Math.cos(a + 1.6) * .3, cz + Math.sin(a + 1.6) * .3)); }
  }
  // stepping stones along the walking path
  const n = Math.round(Math.PI * 2 * WR / .26);
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const s = cyl(.085 + r() * .02, .095, .03, 7, mat(C.stone), Math.cos(a) * WR, .012, Math.sin(a) * WR);
    s.rotation.y = r() * 3; s.castShadow = false; d.add(s);
  }
  // grass tufts and flowers between landmark and path
  for (let i = 0; i < 14; i++) {
    const a = r() * Math.PI * 2, rr = 1.12 + r() * .14;
    if (r() > .5) d.add(mesh(new THREE.ConeGeometry(.04, .12, 4), mat(C.leafDark), Math.cos(a) * rr, .06, Math.sin(a) * rr));
    else d.add(flower(Math.cos(a) * rr, Math.sin(a) * rr, ['#F3E7F0', '#E8A3C2', C.lemon][i % 3]));
  }
  d.position.y = TOP; group.add(d);
  // beach rocks on the sand ring, away from the bridge sides
  for (let i = 0; i < 7; i++) {
    let a = r() * Math.PI * 2;
    const side = Math.round((a - Math.PI / 6) / (Math.PI / 3)) * (Math.PI / 3) + Math.PI / 6;
    if (Math.abs(a - side) < .3) a = side + (a > side ? .35 : -.35);
    const rr = 1.86 + r() * .1;
    group.add(rock(Math.cos(a) * rr, .22, Math.sin(a) * rr, .08 + r() * .08, r));
  }
}

function buildIsland(data) {
  const [x, z] = posOf(data.at);
  const group = new THREE.Group(); group.position.set(x, 0, z);
  [cyl(R * 1.1, R * 1.28, 2.6, 6, mat(C.rock), 0, -1.9, 0), cyl(R * 1.02, R * 1.1, .55, 6, mat(C.sandDark), 0, -.38, 0),
   cyl(R, R * 1.02, .2, 6, mat(C.sand), 0, .15, 0), cyl(R * .9, R * .93, .22, 6, mat(data.color), 0, .36, 0),
   cyl(R * .935, R * .95, .05, 6, mat('#8A6A44'), 0, .27, 0)].forEach(h => { h.rotation.y = Math.PI / 6; group.add(h); });
  const lm = landmark(data.landmark); lm.position.y = TOP; group.add(lm);
  group.add(spotLight('#FFA24A', .5, TOP + 2.6, 1.5, 0, TOP + .3, 0, 6, data.landmark === 'home' ? 2.4 : 1.8));
  decorate(group, data);
  const ring = dyn(new THREE.Mesh(new THREE.RingGeometry(R * .88, R * .97, 6, 1, 0),
    new THREE.MeshBasicMaterial({ color: '#FFE2B8', transparent: true, opacity: 0, depthWrite: false })));
  ring.rotation.x = -Math.PI / 2; ring.position.y = TOP + .006; group.add(ring);
  scene.add(group);
  bake(group);
  group.traverse(o => { o.userData.islandId = data.id; });
  return { data, group, lm, ring, glowV: 0, pos: new THREE.Vector3(x, 0, z) };
}

/* ---------- Bridges between every pair of neighbouring islands ---------- */
function buildBridges() {
  const all = new THREE.Group();
  const wood = mat(C.wood), plank2 = mat('#8F6440'), beamM = mat('#6E4C33'), post = mat('#5E4130');
  islandObjs.forEach(() => adj.push([]));
  for (let i = 0; i < islandObjs.length; i++) for (let j = i + 1; j < islandObjs.length; j++) {
    const A = islandObjs[i].pos, B = islandObjs[j].pos;
    const dist = A.distanceTo(B);
    if (Math.abs(dist - D) > .05) continue;
    const u = B.clone().sub(A).normalize();
    const L = dist - WR * 2, arch = .55, n = Math.round(L / .14);
    const br = { i, j, u, L, arch, start: A.clone().addScaledVector(u, WR) };
    bridges.push(br); adj[i].push({ br, to: j }); adj[j].push({ br, to: i });
    const bv = lightVariant('bridge', bridges.length);
    const g = new THREE.Group();
    g.position.copy(br.start); g.position.y = TOP; g.rotation.y = Math.atan2(-u.z, u.x);
    const yAt = (s) => Math.sin(Math.PI * s / L) * arch;
    const slope = (s) => Math.atan(Math.cos(Math.PI * s / L) * arch * Math.PI / L);
    for (let k = 0; k < n; k++) {
      const s = (k + .5) / n * L;
      const p = box(L / n * .82, .045, .52, k % 3 ? wood : plank2, s, yAt(s) - .02, 0); p.rotation.z = slope(s); g.add(p);
    }
    [-.26, .26].forEach(zz => {
      const pts = [], rail = [];
      const e = .24;
      for (let k = 0; k <= 16; k++) { const s = k / 16 * L, sr = e + k / 16 * (L - 2 * e); pts.push([s, yAt(s) - .06, zz]); rail.push([sr, yAt(sr) + .26, zz * 1.08]); }
      g.add(tube(pts, .035, beamM, 28)); g.add(tube(rail, .02, beamM, 28));
      const posts = 6;
      for (let k = 0; k <= posts; k++) { const s = e + k / posts * (L - 2 * e); g.add(cyl(.022, .026, .3, 6, post, s, yAt(s) + .12, zz * 1.08)); }
      [e, L - e].forEach(s => { g.add(cyl(.035, .035, .42, 6, post, s, yAt(s) + .18, zz * 1.1)); g.add(sph(.05, bv.mat, s, yAt(s) + .42, zz * 1.1, 8, 6)); g.add(typedPool(bv, .42, s, yAt(s) + .01, zz * .55)); });
      [.3, .7].forEach(f => { const s = f * L; const y0 = yAt(s) - .08; g.add(cyl(.05, .06, y0 + 3.4, 7, post, s, (y0 - 3.4) / 2, zz)); });
    });
    [.3, .7].forEach(f => { const s = f * L; g.add(box(.06, .05, .62, beamM, s, yAt(s) - .1, 0)); });
    all.add(g);
  }
  scene.add(all); bake(all);
}

function buildLinks() {
  LINKS.forEach(l => {
    const A = islandObjs.find(o => o.data.id === l.a), B = islandObjs.find(o => o.data.id === l.b);
    if (!A || !B) return;
    const a = A.pos.clone().setY(1.4), b = B.pos.clone().setY(1.4);
    const mid = a.clone().add(b).multiplyScalar(.5); mid.y = 2.6 + a.distanceTo(b) * .16;
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const m = new THREE.MeshBasicMaterial({ color: '#C0804E', transparent: true, opacity: 0, depthWrite: false });
    const t = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, .045, 6), m);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(.11, 10, 8), new THREE.MeshBasicMaterial({ color: '#FFE2B8', transparent: true, opacity: 0, depthWrite: false }));
    scene.add(t, dot);
    linkObjs.push({ l, curve, tube: t, dot, vis: 0, t: Math.random() });
  });
}

  for (let i = 0; i < 16; i++) waterU.uIsl.value.push(new THREE.Vector2(9999, 9999));
  islandObjs.forEach((o, i) => { if (i < 16) waterU.uIsl.value[i].set(o.pos.x, o.pos.z); });
  waterU.uCount.value = Math.min(16, islandObjs.length);
  const size = Math.max(160, extent * 14);
  const geo = new THREE.PlaneGeometry(size, size, 170, 170);
  const m = new THREE.MeshStandardMaterial({ color: '#3F8496', roughness: .5, metalness: .05, flatShading: true });
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, waterU);
    const common = `
      uniform float uTime; uniform vec2 uIsl[16]; uniform int uCount; uniform float uApo; uniform vec3 uShore;
      varying float vH; varying float vDist;
      float hexd(vec2 p){ p = abs(p); return max(p.y, .8660254 * p.x + .5 * p.y); }
      float waveH(vec2 p, float t){ return .07*sin(p.x*.55+t*1.1) + .05*sin(p.y*.7-t*.9) + .035*sin((p.x+p.y)*1.25+t*1.6) + .02*sin((p.x-p.y)*2.1-t*2.2); }
    `;
    sh.vertexShader = common + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec2 wp = (modelMatrix * vec4(position, 1.0)).xz;
      float d = 1e5;
      for (int i = 0; i < 16; i++) { if (i >= uCount) break; d = min(d, hexd(wp - uIsl[i])); }
      float damp = smoothstep(uApo - .2, uApo + 1.4, d);
      float h = waveH(wp, uTime) * (.3 + .7 * damp);
      transformed.z += h; vH = h; vDist = d;`);
    sh.fragmentShader = common + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      float shore = 1. - smoothstep(uApo, uApo + .85, vDist);
      diffuseColor.rgb = mix(diffuseColor.rgb, uShore, shore * .75);
      float ring = uApo + .12 + .07 * sin(uTime * 1.6 + vDist * 2.);
      float foam = 1. - smoothstep(0., .2, abs(vDist - ring));
      foam = max(foam, (1. - smoothstep(0., .1, abs(vDist - ring - .45))) * .3);
      foam = max(foam, smoothstep(.12, .2, vH) * .35);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(1.), foam * .8);`);
  };
  m.customProgramCacheKey = () => 'coffee-sea';
  m.transparent = true; m.opacity = .72;
  sea = new THREE.Mesh(geo, m);
  seabed = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({ color: '#1B4A5A', roughness: 1 }));
  seabed.rotation.x = -Math.PI / 2; seabed.position.set(centroid.x, SEA_Y - 2.4, centroid.z); seabed.receiveShadow = true; scene.add(seabed);
  sea.rotation.x = -Math.PI / 2; sea.position.set(centroid.x, SEA_Y, centroid.z); sea.receiveShadow = true;
  scene.add(sea);
}

  buildCreatures(); buildSky();

  for (let i = 0; i < 16; i++) {
    const b = bean('#6E4A33', .55), ang = Math.random() * Math.PI * 2, r = extent + 5 + Math.random() * 9;
    b.position.set(centroid.x + Math.cos(ang) * r, SEA_Y, centroid.z + Math.sin(ang) * r); b.rotation.y = Math.random() * 6;
    b.userData.float = Math.random() * 6; scene.add(b); bake(b); floaters.push(b);
  }

  const wrap = $('#labels');
  islandObjs.forEach(o => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'label' + (o.data.id === 'home' ? ' home' : '');
    el.style.setProperty('--c', o.data.color);
    el.innerHTML = o.data.id === 'home' ? '<i></i>起點 · 全部島嶼' : `<i></i>${o.data.name}`;
    el.addEventListener('click', () => go(o.data.id));
    wrap.appendChild(el); o.label = el;
  });

  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  const groups = islandObjs.map(o => o.group);
  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(groups, true).find(h => h.object.userData.islandId);
    if (hit) go(hit.object.userData.islandId);
  });
  renderer.domElement.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(groups, true).find(h => h.object.userData.islandId);
    hovered = hit ? hit.object.userData.islandId : null;
    renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
  });

  setOverview(true);
  addEventListener('resize', onResize);
  requestAnimationFrame(loop);
  setTimeout(() => $('#loading').classList.add('done'), 250);
}

const TIME_WORD = { day: '白天', sunset: '夕陽', dusk: '黃昏', night: '夜晚', dawn: '清晨' };
const SKY_KEYS = {
  day:    { zen: null, hor: null, sunCol: '#FFF2D8', sunAmt: .25, sun: '#FFE6C4', sunI: 1.1, dir: [.55, .75, .38], hemiS: '#FFF4E2', hemiG: '#B58F6A', hemiI: .75,
            sea: '#3F8496', shore: '#6FB3B4', bed: '#1B4A5A', glow: .12, stars: 0, cloud: '#FFFFFF', cloudE: '#000000', cloudEI: 0, streak: '#FFFFFF', streakEI: 0, streakO: .35, disc: 0, discCol: '#FFF4D0', moon: 0 },

            sea: '#1F4272', shore: '#2F5F92', bed: '#0E1E3A', glow: 1, stars: .35, cloud: '#7290C4', cloudE: '#25457E', cloudEI: .18, streak: '#86A8DC', streakEI: .28, streakO: .8, disc: .1, discCol: '#D6E6FF', moon: .3 },
  night:  { zen: '#121C42', hor: '#2E4478', sunCol: '#6A84C8', sunAmt: .18, sun: '#A6B6FF', sunI: .32, dir: [-.45, .8, .5], hemiS: '#6478B8', hemiG: '#121830', hemiI: .32,

};
const KEYS = Object.keys(SKY_KEYS);
const AUTO_TRACK = [[0, 'dusk'], [4.8, 'dusk'], [5.6, 'dawn'], [6.8, 'day'], [16.6, 'day'], [17.5, 'sunset'], [18.3, 'dusk'], [24, 'dusk']];
function weightsAt(hour) {
  const w = {};
  for (let i = 0; i < AUTO_TRACK.length - 1; i++) {
    const [h0, k0] = AUTO_TRACK[i], [h1, k1] = AUTO_TRACK[i + 1];
    if (hour >= h0 && hour <= h1) { const f = h1 > h0 ? (hour - h0) / (h1 - h0) : 0; w[k0] = (w[k0] || 0) + 1 - f; w[k1] = (w[k1] || 0) + f; return w; }
  }
  return { night: 1 };
}
let timeMode = 0;
try { const s = localStorage.getItem('coffee-island-time'); if (s !== null) timeMode = Math.max(0, TIME_MODES.findIndex(m => m.id === s)); } catch (e) {}
function nowHour() { const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
function targetWeights() { const m = TIME_MODES[timeMode].id; return m === 'auto' ? weightsAt(nowHour()) : { [m]: 1 }; }
function dominant(w) { return KEYS.reduce((a, k) => ((w[k] || 0) > (w[a] || 0) ? k : a), 'day'); }
function syncTimeButton() {
  const m = TIME_MODES[timeMode];
  const ic = m.id === 'auto' ? (TIME_MODES.find(x => x.id === dominant(targetWeights())) || { ic: '☀' }).ic : m.ic;

  $('#btnTime').setAttribute('aria-label', `光線：${m.t}（點擊切換）`);
}
$('#btnTime').addEventListener('click', () => {

let themeMilk = '#E8D8C3', themeZen = '#C5D3D3';
function readTheme() {
  themeMilk = cssVar('--milk') || '#E8D8C3';
  if (window.THREE) themeZen = '#' + new THREE.Color(themeMilk).lerp(new THREE.Color('#A9C8D4'), .5).getHexString();

const skyU = {};
function buildSkyDome() {
  Object.assign(skyU, { zen: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunCol: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunAmt: { value: 0 } });
  sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform vec3 zen; uniform vec3 hor; uniform vec3 sunCol; uniform vec3 sunDir; uniform float sunAmt; varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 c = mix(hor, zen, smoothstep(-.02, .55, h));
        float s = max(dot(d, normalize(sunDir)), 0.);
        c += sunCol * sunAmt * (pow(s, 6.) * .45 + pow(s, 80.) * .8 + exp(-abs(h) * 9.) * pow(s, 2.) * .4);
        gl_FragColor = vec4(c, 1.);
        #include <encodings_fragment>
      }`
  }));
  sky.renderOrder = -1; scene.add(sky);
  sunDisc = new THREE.Mesh(new THREE.SphereGeometry(7, 20, 14), new THREE.MeshBasicMaterial({ color: '#FFD27A', fog: false, transparent: true, opacity: 0, depthWrite: false }));
  sunHalo = new THREE.Mesh(new THREE.SphereGeometry(16, 20, 14), new THREE.MeshBasicMaterial({ color: '#FFB070', fog: false, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  moonDisc = new THREE.Mesh(new THREE.SphereGeometry(4.5, 20, 14), new THREE.MeshBasicMaterial({ color: '#F4F0E0', fog: false, transparent: true, opacity: 0, depthWrite: false }));
  [sunDisc, sunHalo, moonDisc].forEach(m => { m.renderOrder = -0.5; scene.add(m); });
}

const LT = { w: null, night: 0 };
let cA, cB, cTmp;
const vDir = { x: 0, y: 0, z: 0 };
function keyVal(k, p) { if (k === 'day' && p === 'hor') return themeMilk; if (k === 'day' && p === 'zen') return themeZen; return SKY_KEYS[k][p]; }
function blendC(p, out) {
  out.setRGB(0, 0, 0);
  KEYS.forEach(k => { const w = LT.w[k]; if (w < .001) return; cB.set(keyVal(k, p)); out.r += cB.r * w; out.g += cB.g * w; out.b += cB.b * w; });
  return out;
}
function blendN(p) { return KEYS.reduce((a, k) => a + LT.w[k] * SKY_KEYS[k][p], 0); }
function applyLight(dt, t = 0) {
  if (!cA) { cA = new THREE.Color(); cB = new THREE.Color(); cTmp = new THREE.Color(); }
  const tw = targetWeights();
  if (!LT.w) { LT.w = {}; KEYS.forEach(k => { LT.w[k] = tw[k] || 0; }); }
  const k = Math.min(1, dt * 2);
  KEYS.forEach(key => { LT.w[key] += ((tw[key] || 0) - LT.w[key]) * k; });
  LT.night = LT.w.night + LT.w.dusk * .6;

  blendC('hor', skyU.hor.value); blendC('zen', skyU.zen.value); blendC('sunCol', skyU.sunCol.value); skyU.sunAmt.value = blendN('sunAmt');
  scene.background.copy(skyU.hor.value); scene.fog.color.copy(skyU.hor.value);
  let dx = 0, dy = 0, dz = 0; KEYS.forEach(key => { const w = LT.w[key], d = SKY_KEYS[key].dir; dx += d[0] * w; dy += d[1] * w; dz += d[2] * w; });
  const dl = Math.hypot(dx, dy, dz) || 1; dx /= dl; dy /= dl; dz /= dl;
  skyU.sunDir.value.set(dx, dy, dz);
  sun.position.set(centroid.x + dx * 40, Math.max(3, dy * 40), centroid.z + dz * 40);
  blendC('sun', sun.color); sun.intensity = blendN('sunI');
  blendC('hemiS', hemi.color); blendC('hemiG', hemi.groundColor); hemi.intensity = blendN('hemiI');
  blendC('sea', sea.material.color); blendC('shore', waterU.uShore.value); blendC('bed', seabed.material.color);
  const gl = blendN('glow');
  glowMats.forEach(m => { m.emissiveIntensity = gl; });
  const lit = Math.max(0, Math.min(1, (gl - .3) / .6));
  if (poolMat) poolMat.opacity = lit * .26;
  updateTypedLights(lit, t);
  nightLights.forEach(l => { l.intensity = l.userData.power * lit; });
  stars.material.opacity = blendN('stars');
  blendC('cloud', cloudMat.color); blendC('cloudE', cloudMat.emissive); cloudMat.emissiveIntensity = blendN('cloudEI');
  blendC('streak', streakMat.color); blendC('cloudE', streakMat.emissive); streakMat.emissiveIntensity = blendN('streakEI'); streakMat.opacity = blendN('streakO');
  const cp = camera.position;
  sky.position.copy(cp);
  const disc = blendN('disc');
  sunDisc.position.set(cp.x + dx * 250, cp.y + Math.max(dy, .02) * 250, cp.z + dz * 250); sunHalo.position.copy(sunDisc.position);
  blendC('discCol', sunDisc.material.color); sunDisc.material.opacity = disc; sunHalo.material.opacity = disc * .22;
  sunDisc.visible = disc > .01; sunHalo.visible = disc > .01;
  moonDisc.position.set(cp.x - 120, cp.y + 150, cp.z - 160); moonDisc.material.opacity = blendN('moon'); moonDisc.visible = moonDisc.material.opacity > .01;
  if (beam) beam.children.forEach(c => { c.material.opacity = Math.max(0, LT.night - .3) * .25; });
}
function tickClock() {
  const d = new Date();
  $('#clock').textContent = `島上時間 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} · ${TIME_WORD[dominant(weightsAt(nowHour()))]}`;
  if (TIME_MODES[timeMode].id === 'auto') syncTimeButton();
}
tickClock(); setInterval(tickClock, 30000);

/* ---------- Camera moves ---------- */
let selected = null, hovered = null, tween = null, showAllLinks = false;
const view = { x: 0, y: 0 };

function overviewPose() {
  const portrait = innerHeight > innerWidth;
  const dist = extent * (portrait ? 4.6 : 3.1);
  const t = new THREE.Vector3(centroid.x, 0, centroid.z);
  return { target: t, pos: t.clone().add(new THREE.Vector3(0, dist * .72, dist * .7)) };
}
function flyTo(target, pos, instant) {
  if (instant || reduceMotion) {
    controls.target.copy(target); camera.position.copy(pos); controls.update(); tween = null; return;
  }
  tween = { t0: performance.now(), dur: 1000, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos };
}
function setOverview(instant) { const p = overviewPose(); flyTo(p.target, p.pos, instant); }
function flyToIsland(o) {
  const t = o.pos.clone(); t.y = .7;
  const dir = camera.position.clone().sub(controls.target); dir.y = 0;
  if (dir.lengthSq() < .01) dir.set(0, 0, 1);
  dir.normalize();
  const dist = isPhone() ? 13 : 11;
  const pos = t.clone().add(dir.multiplyScalar(dist * .66)); pos.y = t.y + dist * .7;
  flyTo(t, pos);
}
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

/* ---------- Loop ---------- */
let v3, tan;
let last = performance.now(), boatT = 0, wakeClock = 0, wakeIdx = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!v3) { v3 = new THREE.Vector3(); tan = new THREE.Vector3(); }
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  const t = now / 1000, still = reduceMotion;

  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = 1 - Math.pow(1 - k, 3);
    controls.target.lerpVectors(tween.ft, tween.tt, e); camera.position.lerpVectors(tween.fp, tween.tp, e);
    if (k >= 1) tween = null;
  }
  controls.update();

  const open = !panel.classList.contains('closed');
  const tx = open && !isPhone() ? 210 : 0, ty = open && isPhone() ? innerHeight * .25 : 0;
  view.x += (tx - view.x) * .1; view.y += (ty - view.y) * .1;
  if (Math.abs(view.x) > .5 || Math.abs(view.y) > .5) camera.setViewOffset(innerWidth, innerHeight, view.x, view.y, innerWidth, innerHeight);
  else camera.clearViewOffset();

  applyLight(dt, t);
  if (!still) waterU.uTime.value = t;
  const wt = waterU.uTime.value;

  islandObjs.forEach(o => {
    const want = o.data.id === selected ? .75 + (still ? 0 : Math.sin(t * 3) * .2) : (o.data.id === hovered ? .45 : 0);
    o.glowV += (want - o.glowV) * .15;
    o.ring.material.opacity = o.glowV; o.ring.visible = o.glowV > .01;
    if (o.lm.userData.flag && !still) o.lm.userData.flag.rotation.y = Math.sin(t * 3) * .3;
  });
  if (beam && !still) beam.rotation.y = t * .6;

  if (!still) {
    updateWalkers(dt);
    spinners.forEach(s => { s.obj.rotation.y += s.speed * dt; });
    puffs.forEach(p => {
      const k = (t * .3 + p.userData.phase) % 1, b = p.userData.base;
      p.position.set(b.x + Math.sin(k * 5) * .12 + k * .25, b.y + k * 1.4, b.z);
      p.scale.setScalar(.6 + k * 1.6); p.material.opacity = .7 * (1 - k);
    });
    clouds.forEach(c => { c.position.x += c.userData.speed * dt; if (c.position.x > centroid.x + extent * 1.8) c.position.x = centroid.x - extent * 1.8; });
  }

  floaters.forEach(b => { b.position.y = SEA_Y + waveY(b.position.x, b.position.z, wt) + .02; if (!still) b.rotation.y += .002; });

  if (!still) boatT = (boatT + dt * .009) % 1;
  boatCurve.getPointAt(boatT, boat.position); boatCurve.getTangentAt(boatT, tan);
  const bx = boat.position.x, bz = boat.position.z;
  boat.position.y = SEA_Y + waveY(bx, bz, wt) - .05;
  const fwdY = waveY(bx + tan.x * .6, bz + tan.z * .6, wt) - waveY(bx - tan.x * .6, bz - tan.z * .6, wt);
  boat.rotation.set(still ? 0 : Math.sin(t * 1.1) * .05, Math.atan2(-tan.z, tan.x), Math.atan2(fwdY, 1.2));
  if (!still) {
    wakeClock += dt;
    if (wakeClock > .14) {
      wakeClock = 0; ripple(bx - tan.x * .7, bz - tan.z * .7, 1, t);
    }
    creatures.forEach(c => c.update(t, dt, wt));
    wake.forEach(w => {
      const age = t - w.userData.born, k = Math.min(1, age / 2.4);
      w.material.opacity = (1 - k) * .55; w.visible = k < 1;
      w.scale.setScalar((.6 + k * 2.4) * w.userData.size);
      w.position.y = SEA_Y + waveY(w.position.x, w.position.z, wt) + .03;
    });
  }

  linkObjs.forEach(L => {
    const on = showAllLinks || (selected && (L.l.a === selected || L.l.b === selected));
    L.vis += ((on ? 1 : 0) - L.vis) * .1;
    L.tube.material.opacity = L.vis * (selected && on && !showAllLinks ? .95 : .7);
    L.tube.visible = L.vis > .01;
    L.t = (L.t + dt * .3) % 1;
    let pt = L.t; if (selected && L.l.b === selected) pt = 1 - pt;
    L.curve.getPointAt(pt, L.dot.position);
    L.dot.material.opacity = L.vis; L.dot.visible = L.vis > .01 && !still;
  });

  renderer.render(scene, camera);

  const linkedIds = new Set();
  if (selected) LINKS.forEach(l => { if (l.a === selected) linkedIds.add(l.b); if (l.b === selected) linkedIds.add(l.a); });
  islandObjs.forEach(o => {
    v3.copy(o.pos); v3.y = o.data.id === 'home' ? 3.1 : 2.4;
    v3.project(camera);
    const x = (v3.x * .5 + .5) * innerWidth, y = (-v3.y * .5 + .5) * innerHeight;
    o.label.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
    o.label.classList.toggle('hidden', v3.z > 1);
    o.label.classList.toggle('active', o.data.id === selected);
    o.label.classList.toggle('linked', linkedIds.has(o.data.id));
  });

  updateTimer(false);
}

    </div>
    <div class="panel-body"><div class="list-group">
      ${ISLANDS.map(d => `<button class="list-item" type="button" data-go="${d.id}" style="--c:${d.color}">
          <span class="hex"></span>
          <span><b>${esc(d.name)}</b><small>${esc(d.lead)}</small></span>
          <em>${d.points.length} 項</em>
        </button>`).join('')}
    </div></div>`;
}
panel.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  if (e.target.closest('[data-act="close"]')) closePanel();
});

/* ---------- Navigation (hash = shareable link per island) ---------- */
function go(id) {
  if (id === 'home') { openList(); return; }
  if (location.hash.slice(1) !== id) { location.hash = id; return; }
  show(id);
}
function show(id) {
  const d = byId(id); if (!d) return;
  selected = id; btnList.setAttribute('aria-pressed', 'false');
  renderIsland(d); panel.classList.remove('closed'); hint.classList.add('gone');
  const o = islandObjs.find(x => x.data.id === id);
  if (o && camera) flyToIsland(o);
}
function openList() {
  selected = null; renderList(); panel.classList.remove('closed'); hint.classList.add('gone');
  btnList.setAttribute('aria-pressed', 'true');
  if (camera) setOverview();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
function closePanel() {
  panel.classList.add('closed'); selected = null; btnList.setAttribute('aria-pressed', 'false');
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  if (camera) setOverview();
}
addEventListener('hashchange', () => { const id = location.hash.slice(1); id ? show(id) : closePanel(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !e.target.closest('input, select')) closePanel(); });
$('#btnHome').addEventListener('click', closePanel);
btnList.addEventListener('click', () => btnList.getAttribute('aria-pressed') === 'true' ? closePanel() : openList());
btnLinks.addEventListener('click', () => {
  showAllLinks = !showAllLinks; btnLinks.setAttribute('aria-pressed', String(showAllLinks));
  if (showAllLinks && camera && !selected) setOverview();
});

if (has3D) initScene();
const startId = location.hash.slice(1);
if (startId) setTimeout(() => show(startId), 400);
</script>
</body>
</html>
